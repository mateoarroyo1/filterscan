<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner de Filtros PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --border: #dde2ea;
    --blue: #1a6dff;
    --blue-dim: #1a6dff18;
    --amber: #e67e00;
    --red: #e02020;
    --green: #1aaa55;
    --text: #111827;
    --muted: #6b7280;
    --font: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 500px;
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  header h1 span { color: var(--blue); }
  .badge {
    font-size: 11px;
    background: var(--blue);
    color: #fff;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 700;
  }

  main {
    width: 100%;
    max-width: 500px;
    padding: 0 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .viewfinder-wrap {
    position: relative;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 4/3;
    box-shadow: 0 4px 24px #0002;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .scan-zone {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 78%; height: 30%;
    pointer-events: none;
  }
  .scan-zone::before, .scan-zone::after,
  .scan-zone .corner-br, .scan-zone .corner-bl {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    border-color: #fff;
    border-style: solid;
  }
  .scan-zone::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 3px 0 0 0; }
  .scan-zone::after  { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 3px 0 0; }
  .scan-zone .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 3px 0; }
  .scan-zone .corner-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 3px; }

  .scan-line {
    position: absolute;
    left: 3px; right: 3px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    animation: scanline 2s linear infinite;
    opacity: 0;
  }
  .scanning .scan-line { opacity: 1; }
  @keyframes scanline {
    0%   { top: 4px; }
    100% { top: calc(100% - 4px); }
  }

  .vf-status {
    position: absolute;
    bottom: 12px;
    left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 4px #0006;
    letter-spacing: 0.3px;
  }
  .vf-status.error { color: #ff6b6b; }

  .btn-capture {
    width: 100%;
    padding: 18px;
    font-family: var(--font);
    font-size: 18px;
    font-weight: 700;
    background: var(--blue);
    border: none;
    color: #fff;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 16px #1a6dff33;
  }
  .btn-capture:hover  { background: #1558d6; }
  .btn-capture:active { transform: scale(0.98); }
  .btn-capture:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .btn-capture .spinner {
    display: none;
    width: 20px; height: 20px;
    border: 3px solid #ffffff55;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  .btn-capture.loading .label   { display: none; }
  .btn-capture.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .manual-row {
    display: flex;
    gap: 10px;
  }
  .manual-row input {
    flex: 1;
    padding: 15px 16px;
    font-family: var(--font);
    font-size: 17px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: var(--panel);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .manual-row input:focus { border-color: var(--blue); }
  .manual-row input::placeholder { color: #b0b8c4; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .manual-row button {
    padding: 15px 20px;
    font-family: var(--font);
    font-size: 16px;
    font-weight: 700;
    background: var(--panel);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .manual-row button:hover { border-color: var(--blue); color: var(--blue); }

  .result-panel {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: none;
    box-shadow: 0 2px 12px #0001;
  }
  .result-panel.visible { display: block; }

  .result-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
  .status-dot.approx { background: var(--amber); }
  .status-dot.error  { background: var(--red); }
  .status-label {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--green);
  }
  .status-label.approx { color: var(--amber); }
  .status-label.error  { color: var(--red); }

  .found-card { padding: 18px; }
  .found-code {
    font-size: 36px;
    font-weight: 800;
    color: var(--blue);
    letter-spacing: 1px;
    line-height: 1;
    margin-bottom: 14px;
  }
  .found-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 16px;
  }
  .found-grid .lbl {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding-top: 2px;
  }
  .found-grid .val {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .equiv-section {
    border-top: 2px solid var(--border);
    padding: 16px 18px;
  }
  .equiv-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .equiv-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .equiv-chip {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .equiv-chip:hover { border-color: var(--blue); background: var(--blue-dim); }
  .equiv-chip.active { border-color: var(--blue); background: var(--blue-dim); }
  .equiv-chip.active .chip-code { color: var(--blue); }
  .chip-code {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .chip-marca {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 2px;
  }

  .not-found {
    padding: 20px 18px;
    font-size: 16px;
    color: var(--muted);
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <h1>Filter<span>Scan</span></h1>
  <span class="badge">PRO</span>
</header>

<main>

  <!-- CÁMARA -->
  <div class="viewfinder-wrap" id="viewfinder">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-zone">
      <div class="corner-br"></div>
      <div class="corner-bl"></div>
      <div class="scan-line"></div>
    </div>
    <div class="vf-status" id="vfStatus">Iniciando cámara...</div>
  </div>

  <!-- CAPTURA -->
  <button class="btn-capture" id="btnCaptura" onclick="capturar()" disabled>
    <span class="label">⬡ Escanear código</span>
    <span class="spinner"></span>
  </button>

  <!-- MANUAL -->
  <div class="manual-row">
    <input id="manual" type="text" placeholder="Código manual (ej: H601/4)" autocomplete="off">
    <button onclick="buscarManual()">BUSCAR</button>
  </div>

  <!-- RESULTADO -->
  <div class="result-panel" id="resultado"></div>

</main>

<script>
const video    = document.getElementById("video");
const vfStatus = document.getElementById("vfStatus");
const btnCap   = document.getElementById("btnCaptura");
const scanZone = document.querySelector(".scan-zone");
let DB = {};

// ─── CARGAR DB ────────────────────────────────────────────────
fetch("database.json")
  .then(r => r.json())
  .then(d => { DB = d; console.log("DB cargada:", Object.keys(DB).length, "registros"); })
  .catch(() => console.error("No se pudo cargar database.json"));

// ─── CÁMARA ──────────────────────────────────────────────────
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
  .then(stream => {
    video.srcObject = stream;
    vfStatus.textContent = "Listo — Apuntar al código";
    btnCap.disabled = false;
  })
  .catch(() => {
    vfStatus.textContent = "Error al acceder a la cámara";
    vfStatus.classList.add("error");
  });

// ─── CAPTURA Y PROCESADO ─────────────────────────────────────
function capturar() {
  const vw = video.videoWidth  || 640;
  const vh = video.videoHeight || 480;

  // Mandamos el frame completo: Claude encuentra el codigo solo
  const canvas = document.createElement("canvas");
  canvas.width  = vw;
  canvas.height = vh;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  const base64 = canvas.toDataURL("image/jpeg", 0.85).split(",")[1];

  setLoading(true);
  scanZone.classList.add("scanning");

  leerConClaude(base64);
}

// ─── CLAUDE VISION (vía proxy Netlify) ───────────────────────
async function leerConClaude(base64) {
  try {
    // Llamamos a NUESTRA función serverless, no directo a Anthropic.
    // La API key nunca sale del servidor.
    const response = await fetch("/.netlify/functions/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imageBase64: base64 })
    });

    const data = await response.json();

    if (data.error) throw new Error(data.error);

    const codigoRaw = data.codigo || "NO_DETECTADO";
    const codigo = codigoRaw.toUpperCase().replace(/\s+/g, "");

    console.log("Claude detectó:", codigo);
    buscarInteligente(codigo);

  } catch (e) {
    console.error("Error Claude API:", e);
    mostrarError("Error: " + e.message + "\nRevisa los logs en Netlify o usá búsqueda manual.");
  } finally {
    setLoading(false);
    scanZone.classList.remove("scanning");
  }
}

// ─── BÚSQUEDA ────────────────────────────────────────────────
function buscarInteligente(codigo) {
  if (!codigo || codigo === "NO_DETECTADO") {
    mostrarError("No se detectó ningún código en la imagen.\nIntentá de nuevo con mejor iluminación.");
    return;
  }

  // Buscar exacto
  if (DB[codigo]) {
    return mostrar(codigo, DB[codigo], false);
  }

  // Buscar sin espacios / variantes
  const normalizado = codigo.replace(/[\s\-]/g, "");
  if (DB[normalizado]) {
    return mostrar(normalizado, DB[normalizado], false);
  }

  // Fuzzy por distancia Levenshtein
  let mejor = null;
  let mejorDist = Infinity;

  for (const key in DB) {
    const d = levenshtein(codigo, key);
    if (d < mejorDist) { mejorDist = d; mejor = key; }
  }

  const umbral = Math.max(2, Math.floor(codigo.length * 0.25));

  if (mejorDist <= umbral && mejor) {
    mostrar(mejor, DB[mejor], true, codigo);
  } else {
    mostrarError(`Código no encontrado en la base de datos.\nDetectado: ${codigo}`);
  }
}

function buscarManual() {
  const codigo = document.getElementById("manual").value.trim().toUpperCase();
  if (!codigo) return;
  buscarInteligente(codigo);
}

// Enter en input
document.getElementById("manual").addEventListener("keydown", e => {
  if (e.key === "Enter") buscarManual();
});

// ─── RENDER RESULTADO ────────────────────────────────────────
function mostrar(codigo, data, aproximado = false, detectado = "") {
  const panel = document.getElementById("resultado");

  const statusClass = aproximado ? "approx" : "";
  const statusLabel = aproximado
    ? `Coincidencia aproximada${detectado ? ` (detectado: ${detectado})` : ""}`
    : "Código encontrado";

  // Equivalencias vienen directo de la DB
  const equivs = data.equivalencias || [];

  const chipsHTML = equivs.length > 0 ? `
    <div class="equiv-section">
      <div class="equiv-title">Equivalencias · ${equivs.length} código${equivs.length !== 1 ? "s" : ""}</div>
      <div class="equiv-grid">
        ${equivs.map(e => `
          <div class="equiv-chip" onclick="resaltarChip(this, '${e.codigo.toUpperCase()}')">
            <div class="chip-code">${e.codigo.toUpperCase()}</div>
            <div class="chip-marca">${e.marca}</div>
          </div>
        `).join("")}
      </div>
    </div>
  ` : "";

  // Modelos: puede ser array
  const modelos = Array.isArray(data.modelos) ? data.modelos.join(" / ") : (data.modelos || "—");

  panel.innerHTML = `
    <div class="result-header">
      <div class="status-dot ${statusClass}"></div>
      <span class="status-label ${statusClass}">${statusLabel}</span>
    </div>
    <div class="found-card">
      <div class="found-code">${codigo}</div>
      <div class="found-grid">
        <span class="lbl">Marca</span>    <span class="val">${data.marca}</span>
        <span class="lbl">Tipo</span>     <span class="val">${data.tipo}</span>
        <span class="lbl">Vehículo</span> <span class="val">${modelos}</span>
      </div>
    </div>
    ${chipsHTML}
  `;

  panel.classList.add("visible");
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function mostrarError(msg) {
  const panel = document.getElementById("resultado");
  panel.innerHTML = `
    <div class="result-header">
      <div class="status-dot error"></div>
      <span class="status-label error">Sin resultado</span>
    </div>
    <div class="not-found">${msg.replace(/\n/g, "<br>")}</div>
  `;
  panel.classList.add("visible");
}

function resaltarChip(el, codigo) {
  document.querySelectorAll(".equiv-chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("manual").value = codigo;
}

// ─── UTILS ───────────────────────────────────────────────────
function setLoading(on) {
  btnCap.disabled = on;
  btnCap.classList.toggle("loading", on);
  vfStatus.textContent = on ? "Analizando con IA..." : "Listo — Apuntar al código";
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i][j-1], dp[i-1][j]);
  return dp[m][n];
}
</script>
</body>
</html>
