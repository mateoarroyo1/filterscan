<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FilterScan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f4f6;
  --panel: #fff;
  --border: #e8e8ec;
  --orange: #ff6a00;
  --orange-light: #fff0e6;
  --dark: #111214;
  --dark2: #1c1e22;
  --dark3: #26282e;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --text: #111214;
  --muted: #8a8f9a;
  --f: 'Inter', sans-serif;
  --nav: 64px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--f); background: var(--dark); color: #fff; overflow: hidden; }

/* ── PAGES ── */
.page { position: fixed; inset: 0; bottom: var(--nav); display: none; flex-direction: column; overflow-y: auto; }
.page.active { display: flex; }

/* ── BOTTOM NAV ── */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav);
  background: var(--dark); border-top: 1px solid var(--dark3);
  display: flex; z-index: 200;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px; border: none; background: none;
  cursor: pointer; font-family: var(--f); color: var(--muted); transition: color .15s;
}
.nav-btn.active { color: var(--orange); }
.nav-icon { font-size: 22px; line-height: 1; }
.nav-label { font-size: 11px; font-weight: 600; }

/* ══════════ SCANNER PAGE ══════════ */
#page-scanner {
  background: var(--dark);
}

.scanner-header {
  padding: 16px 20px 12px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.brand-logo {
  font-size: 18px; font-weight: 900; letter-spacing: 1px;
  color: #fff;
}
.brand-logo span { color: var(--orange); }
.scan-flash-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--dark3); border: none; cursor: pointer;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
}

/* viewfinder */
.vf-wrap {
  flex: 1; position: relative; overflow: hidden;
  min-height: 0;
}
.vf-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }

/* corners */
.vf-zone {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -55%);
  width: 72%; height: 22%; pointer-events: none;
}
.vfc { position: absolute; width: 22px; height: 22px; border-color: var(--orange); border-style: solid; }
.vfc.tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
.vfc.tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
.vfc.br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
.vfc.bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
.vfl {
  position: absolute; left: 3px; right: 3px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--orange), transparent);
  animation: sl 2s linear infinite; opacity: 0;
}
.scanning .vfl { opacity: 1; }
@keyframes sl { 0%{top:3px} 100%{top:calc(100% - 3px)} }

/* scan hint */
.scan-hint {
  position: absolute; bottom: 20%; left: 0; right: 0;
  text-align: center; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,.55);
}

/* manual input floating over camera */
.scan-manual-row {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 14px 16px;
  background: linear-gradient(to top, var(--dark) 60%, transparent);
  display: flex; gap: 10px;
}
.scan-manual-row input {
  flex: 1; padding: 13px 16px; font-family: var(--f); font-size: 15px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px;
  background: var(--dark2); border: 1.5px solid var(--dark3); color: #fff;
  border-radius: 12px; outline: none; transition: border-color .15s;
}
.scan-manual-row input:focus { border-color: var(--orange); }
.scan-manual-row input::placeholder { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.scan-manual-row button {
  padding: 13px 18px; font-family: var(--f); font-size: 14px; font-weight: 700;
  background: var(--orange); color: #fff; border: none; border-radius: 12px; cursor: pointer;
}

/* big scan button */
.scan-btn-wrap {
  padding: 0 16px 16px; flex-shrink: 0;
  background: var(--dark);
}
.scan-btn {
  width: 100%; padding: 17px; font-family: var(--f); font-size: 17px; font-weight: 800;
  background: var(--orange); color: #fff; border: none; border-radius: 14px; cursor: pointer;
  transition: all .12s; letter-spacing: .3px;
}
.scan-btn:active { transform: scale(.97); }
.scan-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.scan-btn .sp { display:none; width:18px;height:18px;border:3px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto; }
.scan-btn.loading .lbl{display:none;} .scan-btn.loading .sp{display:block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── RESULT SHEET (slides up) ── */
.result-sheet {
  position: fixed; left: 0; right: 0; bottom: var(--nav);
  background: var(--panel); border-radius: 22px 22px 0 0;
  box-shadow: 0 -8px 40px #00000040;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
  z-index: 150; overflow-y: auto;
  max-height: calc(100vh - var(--nav) - 50px);
}
.result-sheet.open { transform: translateY(0); }

.rs-handle {
  width: 36px; height: 4px; background: #d1d5db; border-radius: 2px;
  margin: 12px auto 0;
}
.rs-close {
  position: absolute; top: 14px; right: 16px;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--bg); cursor: pointer; font-size: 16px; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
}

/* result header card (dark) */
.rs-card {
  margin: 10px 16px 0;
  background: var(--dark); border-radius: 16px; padding: 16px;
  color: #fff;
}
.rs-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.rs-brand { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.rs-code  { font-size: 30px; font-weight: 900; letter-spacing: .5px; line-height: 1; }
.rs-stock-wrap { text-align: right; }
.rs-stock-num { font-size: 42px; font-weight: 900; line-height: 1; color: #fff; }
.rs-stock-num.zero{color:var(--red);} .rs-stock-num.low{color:var(--amber);} .rs-stock-num.ok{color:var(--green);}
.rs-stock-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; text-align: right; }
.rs-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.rs-tag {
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
  background: rgba(255,106,0,.18); color: var(--orange); border: 1px solid rgba(255,106,0,.3);
  display: flex; align-items: center; gap: 4px;
}

/* mov buttons */
.rs-mov-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px 0; }
.rs-mov-btn {
  padding: 15px; font-family: var(--f); font-size: 16px; font-weight: 800;
  border-radius: 12px; cursor: pointer; border: none; transition: all .12s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.rs-mov-btn:active { transform: scale(.96); }
.btn-salida  { background: var(--orange); color: #fff; }
.btn-entrada { background: var(--bg); color: var(--text); border: 2px solid var(--border); }

/* qty row */
.rs-qty-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px 0;
}
.rs-qty-lbl { font-size: 14px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
.qty-ctrl { display: flex; align-items: center; border: 2px solid var(--border); border-radius: 10px; overflow: hidden; }
.qty-btn { width: 40px; height: 40px; border: none; background: var(--bg); font-size: 20px; font-weight: 700; cursor: pointer; color: var(--text); }
.qty-btn:active { background: var(--border); }
.qty-inp { width: 50px; text-align: center; font-size: 18px; font-weight: 800; border: none; border-left: 2px solid var(--border); border-right: 2px solid var(--border); outline: none; font-family: var(--f); color: var(--text); background: #fff; padding: 6px 0; }

.rs-feedback { text-align: center; padding: 8px 16px 0; font-size: 14px; font-weight: 600; color: var(--muted); display: none; }
.rs-feedback.show { display: block; }

/* sections */
.rs-section { padding: 18px 16px 0; }
.rs-section-title {
  font-size: 12px; font-weight: 800; color: var(--text); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.rs-section-badge {
  width: 20px; height: 20px; border-radius: 50%; background: var(--orange);
  color: #fff; font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}

/* vehicle rows */
.veh-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.veh-row:last-child { border-bottom: none; }
.veh-icon {
  width: 44px; height: 44px; border-radius: 10px; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
}
.veh-name { font-size: 15px; font-weight: 700; }
.veh-sub  { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* equivalencias */
.equiv-toggle-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border: none; background: none; cursor: pointer; font-family: var(--f);
}
.etb-left { display: flex; align-items: center; gap: 8px; }
.etb-title { font-size: 12px; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }
.etb-arr { font-size: 16px; color: var(--muted); transition: transform .2s; }
.equiv-toggle-btn.open .etb-arr { transform: rotate(180deg); }
.equiv-body { display: none; padding-bottom: 16px; }
.equiv-body.open { display: block; }

.eq-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.eq-row:last-child { border-bottom: none; }
.eq-marca { font-size: 13px; color: var(--muted); font-weight: 500; min-width: 90px; }
.eq-code  { font-size: 15px; font-weight: 700; flex: 1; padding: 0 8px; }
.eq-stock-badge {
  padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
  white-space: nowrap;
}
.esb-ok   { background: #dcfce7; color: #15803d; }
.esb-low  { background: #fef3c7; color: #b45309; }
.esb-zero { background: #fee2e2; color: #b91c1c; }
.esb-none { background: var(--bg); color: var(--muted); }

.rs-bottom-pad { height: 20px; }

/* ══════════ FLOTA PAGE ══════════ */
#page-flota { background: var(--bg); }

.flota-header {
  padding: 20px 20px 8px; background: var(--panel);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.flota-title { font-size: 24px; font-weight: 900; color: var(--text); }
.flota-sub   { font-size: 13px; color: var(--muted); margin-top: 2px; }

.flota-list { flex: 1; overflow-y: auto; padding: 12px 16px; }

.flota-item {
  background: var(--panel); border-radius: 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  cursor: pointer; transition: all .15s; border: 1.5px solid transparent;
}
.flota-item:hover { border-color: var(--orange); }
.flota-item.active { border-color: var(--orange); background: #fff8f4; }
.fi-icon {
  width: 46px; height: 46px; border-radius: 10px; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
}
.fi-info { flex: 1; min-width: 0; }
.fi-name { font-size: 16px; font-weight: 800; color: var(--text); }
.fi-filters { font-size: 12px; font-weight: 700; color: var(--orange); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }
.fi-arrow { color: var(--muted); font-size: 18px; }

/* flota detail panel */
.flota-detail {
  background: var(--panel); border-radius: 20px 20px 0 0;
  position: fixed; left: 0; right: 0; bottom: var(--nav);
  max-height: 75vh; transform: translateY(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  z-index: 100; overflow-y: auto;
  box-shadow: 0 -4px 30px #00000018;
}
.flota-detail.open { transform: translateY(0); }
.fd-handle { width: 36px; height: 4px; background: #d1d5db; border-radius: 2px; margin: 12px auto 0; }
.fd-header {
  padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.fd-title { font-size: 18px; font-weight: 900; }
.fd-close {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--bg); cursor: pointer; font-size: 16px; color: var(--muted);
}

/* filtros por tipo */
.fd-tipo-item {
  border-bottom: 1px solid var(--border); overflow: hidden;
}
.fd-tipo-item:last-child { border-bottom: none; }

.fd-tipo-header {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 15px 18px; border: none; background: none; cursor: pointer; font-family: var(--f);
}
.fd-tipo-left { text-align: left; }
.fd-tipo-name { font-size: 16px; font-weight: 800; color: var(--text); }
.fd-tipo-right { display: flex; align-items: center; gap: 10px; }
.fd-tipo-stock { font-size: 28px; font-weight: 900; }
.fd-tipo-stock.zero{color:var(--red);} .fd-tipo-stock.low{color:var(--amber);} .fd-tipo-stock.ok{color:var(--green);}
.fd-tipo-arr { font-size: 16px; color: var(--muted); transition: transform .2s; }
.fd-tipo-header.open .fd-tipo-arr { transform: rotate(180deg); }

.fd-equiv-body { display: none; background: var(--bg); }
.fd-equiv-body.open { display: block; }
.fd-eq-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 18px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .12s;
}
.fd-eq-row:last-child { border-bottom: none; }
.fd-eq-row:hover { background: #fff; }
.fd-eq-marca { font-size: 12px; color: var(--muted); font-weight: 500; min-width: 80px; }
.fd-eq-code  { font-size: 15px; font-weight: 700; flex: 1; }
.fd-eq-stock {
  padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
}
.fes-ok   { background: #dcfce7; color: #15803d; }
.fes-low  { background: #fef3c7; color: #b45309; }
.fes-zero { background: #fee2e2; color: #b91c1c; }
</style>
</head>
<body>

<!-- ══ SCANNER PAGE ══ -->
<div class="page active" id="page-scanner">

  <div class="scanner-header">
    <div class="brand-logo">FILTER<span>SCAN</span></div>
    <button class="scan-flash-btn">⚡</button>
  </div>

  <div class="vf-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="sz" class="vf-zone">
      <div class="vfc tl"></div><div class="vfc tr"></div>
      <div class="vfc br"></div><div class="vfc bl"></div>
      <div class="vfl"></div>
    </div>
    <div class="scan-hint" id="scanHint">Apuntar al código del filtro</div>

    <div class="scan-manual-row">
      <input id="manual" type="text" placeholder="Buscar por código..." autocomplete="off">
      <button onclick="buscarManual()">IR</button>
    </div>
  </div>

  <div class="scan-btn-wrap">
    <button class="scan-btn" id="btnCap" onclick="capturar()" disabled>
      <span class="lbl">📷 Escanear</span>
      <span class="sp"></span>
    </button>
  </div>

</div>

<!-- ══ RESULT SHEET ══ -->
<div class="result-sheet" id="resultSheet">
  <div class="rs-handle"></div>
  <button class="rs-close" onclick="closeResult()">✕</button>

  <div class="rs-card">
    <div class="rs-card-top">
      <div>
        <div class="rs-brand" id="rsBrand">—</div>
        <div class="rs-code"  id="rsCode">—</div>
      </div>
      <div class="rs-stock-wrap">
        <div class="rs-stock-num" id="rsStockNum">—</div>
        <div class="rs-stock-lbl">en stock</div>
      </div>
    </div>
    <div class="rs-tags" id="rsTags"></div>
  </div>

  <div class="rs-mov-btns">
    <button class="rs-mov-btn btn-salida"  onclick="registrarMov(-1)">↑ Salida</button>
    <button class="rs-mov-btn btn-entrada" onclick="registrarMov(+1)">↓ Entrada</button>
  </div>

  <div class="rs-qty-row">
    <span class="rs-qty-lbl">Cantidad</span>
    <div class="qty-ctrl">
      <button class="qty-btn" onclick="qtyChange(-1)">−</button>
      <input class="qty-inp" id="qtyVal" type="number" value="1" min="1" max="999">
      <button class="qty-btn" onclick="qtyChange(+1)">+</button>
    </div>
  </div>

  <div class="rs-feedback" id="rsFeedback"></div>

  <!-- Compatible con -->
  <div class="rs-section">
    <div class="rs-section-title">
      Compatible con
      <span class="rs-section-badge" id="rsVehCount">0</span>
    </div>
    <div id="rsVehiculos"></div>
  </div>

  <!-- Equivalencias -->
  <div class="rs-section" style="padding-bottom:0">
    <button class="equiv-toggle-btn" id="equivToggle" onclick="toggleEquiv()">
      <div class="etb-left">
        <span class="etb-title">Equivalencias</span>
        <span class="rs-section-badge" id="rsEquivCount">0</span>
      </div>
      <span class="etb-arr">▾</span>
    </button>
    <div class="equiv-body" id="equivBody"></div>
  </div>

  <div class="rs-bottom-pad"></div>
</div>

<!-- ══ FLOTA PAGE ══ -->
<div class="page" id="page-flota">

  <div class="flota-header">
    <div class="flota-title">Flota</div>
    <div class="flota-sub">Filtros y stock por vehículo</div>
  </div>

  <div class="flota-list" id="flotaList">
    <div style="padding:30px;text-align:center;color:var(--muted);font-size:14px;">Cargando...</div>
  </div>

</div>

<!-- Flota detail sheet -->
<div class="flota-detail" id="flotaDetail">
  <div class="fd-handle"></div>
  <div class="fd-header">
    <div class="fd-title" id="fdTitle">—</div>
    <button class="fd-close" onclick="closeFlotaDetail()">✕</button>
  </div>
  <div id="fdBody"></div>
</div>

<!-- ══ BOTTOM NAV ══ -->
<nav class="nav">
  <button class="nav-btn active" id="nav-scanner" onclick="goPage('scanner')">
    <span class="nav-icon">⬜</span>
    <span class="nav-label">Escanear</span>
  </button>
  <button class="nav-btn" id="nav-flota" onclick="goPage('flota')">
    <span class="nav-icon">🚛</span>
    <span class="nav-label">Flota</span>
  </button>
</nav>

<script>
const SHEET_URL = "/.netlify/functions/sheets";
let DB = {};
let allStock = [];
let currentGrupo = null;

// ── DB ──
fetch("database.json")
  .then(r => r.json())
  .then(d => { DB = d; renderFlota(); loadStock(); })
  .catch(() => console.error("Error DB"));

async function loadStock() {
  try {
    const res = await fetch(SHEET_URL + '?accion=lista');
    const d = await res.json();
    allStock = d.items || [];
  } catch(e) { allStock = []; }
}

// ── NAV ──
function goPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name !== 'scanner') closeResult();
}

// ── CÁMARA ──
const video = document.getElementById('video');
const btnCap = document.getElementById('btnCap');
const sz = document.getElementById('sz');

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
  .then(s => { video.srcObject = s; btnCap.disabled = false; document.getElementById('scanHint').textContent = 'Apuntar al código del filtro'; })
  .catch(() => { document.getElementById('scanHint').textContent = 'Sin acceso a cámara'; });

function capturar() {
  const c = document.createElement('canvas');
  c.width = video.videoWidth||640; c.height = video.videoHeight||480;
  c.getContext('2d').drawImage(video, 0, 0);
  const b64 = c.toDataURL('image/jpeg', .85).split(',')[1];
  btnCap.disabled = true; btnCap.classList.add('loading');
  sz.classList.add('scanning');
  document.getElementById('scanHint').textContent = 'Analizando...';
  fetch('/.netlify/functions/claude', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({imageBase64:b64}) })
    .then(r => r.json())
    .then(d => { if(d.error) throw new Error(d.error); procesarCodigo((d.codigo||'NO_DETECTADO').toUpperCase().replace(/\s+/g,'')); })
    .catch(e => alert('Error: ' + e.message))
    .finally(() => { btnCap.disabled=false; btnCap.classList.remove('loading'); sz.classList.remove('scanning'); document.getElementById('scanHint').textContent='Apuntar al código del filtro'; });
}

function buscarManual() {
  const c = document.getElementById('manual').value.trim().toUpperCase();
  if (c) procesarCodigo(c);
}
document.getElementById('manual').addEventListener('keydown', e => { if(e.key==='Enter') buscarManual(); });

// ── BUSCAR EN DB ──
function buscarEnDB(codigo) {
  let key = codigo.toUpperCase();
  if (DB[key]) return { key, data: DB[key] };
  const norm = key.replace(/[\s\-]/g,'');
  if (DB[norm]) return { key:norm, data:DB[norm] };
  let best=null, bestD=Infinity;
  const umbral = Math.max(2, Math.floor(key.length*.25));
  for (const k in DB) { const d=lev(key,k); if(d<bestD){bestD=d;best=k;} }
  if (bestD<=umbral && best) return { key:best, data:DB[best], aprox:true, orig:codigo };
  return null;
}

function procesarCodigo(codigo) {
  if (!codigo || codigo==='NO_DETECTADO') { alert('No se detectó ningún código.'); return; }
  const f = buscarEnDB(codigo);
  if (!f) { alert('Código no encontrado: ' + codigo); return; }
  mostrarResult(f.key, f.data);
}

// ── RESULTADO ──
async function mostrarResult(codigo, data) {
  const modelos = Array.isArray(data.modelos) ? data.modelos : [data.modelos||'—'];
  const equivs  = data.equivalencias || [];
  const grupoId = getGrupoId(data.tipo, data.modelos);

  currentGrupo = {
    grupoId, tipo: data.tipo,
    modelos: modelos.join(' / '),
    codigos: [codigo, ...equivs.map(e=>e.codigo.toUpperCase())].slice(0,8).join(', ')
  };

  // Header
  document.getElementById('rsBrand').textContent = data.marca;
  document.getElementById('rsCode').textContent  = codigo;
  document.getElementById('rsTags').innerHTML    = `<span class="rs-tag">⬡ ${data.tipo}</span>`;

  // Vehículos
  document.getElementById('rsVehCount').textContent = modelos.length;
  document.getElementById('rsVehiculos').innerHTML  = modelos.map(m => `
    <div class="veh-row">
      <div class="veh-icon">🚛</div>
      <div><div class="veh-name">${m}</div></div>
    </div>`).join('');

  // Equivalencias
  document.getElementById('rsEquivCount').textContent = equivs.length;
  document.getElementById('equivBody').innerHTML = equivs.map(e => `
    <div class="eq-row">
      <span class="eq-marca">${e.marca}</span>
      <span class="eq-code">${e.codigo.toUpperCase()}</span>
      <span class="eq-stock-badge esb-none" id="eqs-${e.codigo.toUpperCase()}">...</span>
    </div>`).join('');

  // Reset
  document.getElementById('qtyVal').value = 1;
  document.getElementById('rsFeedback').classList.remove('show');
  document.getElementById('rsStockNum').textContent = '...';
  document.getElementById('rsStockNum').className = 'rs-stock-num';
  const et = document.getElementById('equivToggle');
  et.classList.remove('open');
  document.getElementById('equivBody').classList.remove('open');

  // Abrir sheet
  document.getElementById('resultSheet').classList.add('open');

  // Cargar stock total
  const stockItem = allStock.find(i =>
    i.tipo.toUpperCase()===data.tipo.toUpperCase() &&
    modelos.some(m => i.modelos.toUpperCase().includes(m.toUpperCase()))
  );
  if (stockItem !== undefined) {
    setStockNum(stockItem.stock, 'rsStockNum', 'rs-stock-num');
  } else {
    try {
      const s = await apiGetStock(grupoId);
      setStockNum(s, 'rsStockNum', 'rs-stock-num');
    } catch(e) { document.getElementById('rsStockNum').textContent='?'; }
  }

  // Cargar stock por equivalencia
  for (const e of equivs) {
    const key = e.codigo.toUpperCase();
    const el  = document.getElementById('eqs-' + key);
    if (!el) continue;
    // buscar en allStock por código similar
    const si = allStock.find(i => i.codigos && i.codigos.toUpperCase().includes(key));
    if (si !== undefined) {
      setEquivStock(el, si.stock);
    } else {
      el.textContent = '—';
      el.className = 'eq-stock-badge esb-none';
    }
  }
}

function setStockNum(n, id, cls) {
  const el = document.getElementById(id);
  el.textContent = n;
  el.className = cls + ' ' + (n===0?'zero':n<=2?'low':'ok');
}

function setEquivStock(el, n) {
  if (n === undefined || n === null) { el.textContent='—'; el.className='eq-stock-badge esb-none'; return; }
  el.textContent = n===0 ? 'Sin stock' : n<=2 ? `${n} · bajo` : `${n} en stock`;
  el.className = 'eq-stock-badge ' + (n===0?'esb-zero':n<=2?'esb-low':'esb-ok');
}

function closeResult() {
  document.getElementById('resultSheet').classList.remove('open');
  currentGrupo = null;
}

function toggleEquiv() {
  const btn  = document.getElementById('equivToggle');
  const body = document.getElementById('equivBody');
  btn.classList.toggle('open');
  body.classList.toggle('open');
}

// ── MOVIMIENTOS ──
function qtyChange(d) {
  const inp = document.getElementById('qtyVal');
  if (inp) inp.value = Math.max(1, (parseInt(inp.value)||1) + d);
}

async function registrarMov(dir) {
  if (!currentGrupo) return;
  const qty   = parseInt(document.getElementById('qtyVal').value)||1;
  const delta = dir * qty;
  const fb    = document.getElementById('rsFeedback');
  fb.textContent = 'Guardando...'; fb.classList.add('show');
  try {
    const nuevo = await apiUpdate(currentGrupo, delta);
    setStockNum(nuevo, 'rsStockNum', 'rs-stock-num');
    fb.textContent = dir<0 ? `✅ Salida ${qty} — Stock: ${nuevo}` : `✅ Entrada ${qty} — Stock: ${nuevo}`;
    document.getElementById('qtyVal').value = 1;
    setTimeout(() => fb.classList.remove('show'), 2500);
    loadStock();
  } catch(e) {
    fb.textContent = '❌ Error al guardar.';
    setTimeout(() => fb.classList.remove('show'), 3000);
  }
}

// ── FLOTA ──
function renderFlota() {
  const modelos = new Set();
  for (const k in DB) (DB[k].modelos||[]).forEach(m => modelos.add(m));

  const list = document.getElementById('flotaList');
  list.innerHTML = [...modelos].sort().map(m => {
    const tipos = new Set();
    for (const k in DB) if ((DB[k].modelos||[]).includes(m)) tipos.add(DB[k].tipo);
    return `
      <div class="flota-item" onclick="abrirFlotaDetail('${m.replace(/'/g,"\\'")}')">
        <div class="fi-icon">🚛</div>
        <div class="fi-info">
          <div class="fi-name">${m}</div>
          <div class="fi-filters">${tipos.size} tipos de filtro</div>
        </div>
        <span class="fi-arrow">›</span>
      </div>`;
  }).join('');
}

async function abrirFlotaDetail(modelo) {
  document.getElementById('fdTitle').textContent = modelo;
  const body = document.getElementById('fdBody');

  // Agrupar por tipo
  const tiposMap = {};
  for (const k in DB) {
    const d = DB[k];
    if ((d.modelos||[]).includes(modelo)) {
      if (!tiposMap[d.tipo]) tiposMap[d.tipo] = [];
      tiposMap[d.tipo].push({ codigo: k, marca: d.marca });
    }
  }

  body.innerHTML = Object.keys(tiposMap).sort().map((tipo, idx) => {
    const codigos = tiposMap[tipo];
    const grupoId = getGrupoId(tipo, DB[codigos[0].codigo]?.modelos || [modelo]);

    // Buscar stock en allStock
    const si = allStock.find(i =>
      i.tipo.toUpperCase()===tipo.toUpperCase() &&
      i.modelos.toUpperCase().includes(modelo.toUpperCase())
    );
    const stockVal = si ? si.stock : '...';
    const stockCls = stockVal==='...' ? '' : stockVal===0?'zero':stockVal<=2?'low':'ok';

    const equivRows = codigos.map(c => `
      <div class="fd-eq-row" onclick="irAScanner('${c.codigo}')">
        <span class="fd-eq-marca">${c.marca}</span>
        <span class="fd-eq-code">${c.codigo}</span>
        <span class="fd-eq-stock fes-none" id="fdeq-${c.codigo.replace(/\//g,'-')}">—</span>
      </div>`).join('');

    return `
      <div class="fd-tipo-item">
        <button class="fd-tipo-header" id="fdth-${idx}" onclick="toggleFdTipo(${idx})">
          <div class="fd-tipo-left">
            <div class="fd-tipo-name">${tipo}</div>
          </div>
          <div class="fd-tipo-right">
            <span class="fd-tipo-stock ${stockCls}" id="fdts-${grupoId.replace(/[^a-z0-9]/gi,'-')}">${stockVal}</span>
            <span class="fd-tipo-arr">▾</span>
          </div>
        </button>
        <div class="fd-equiv-body" id="fdeb-${idx}">
          ${equivRows}
        </div>
      </div>`;
  }).join('');

  document.getElementById('flotaDetail').classList.add('open');

  // Cargar stocks que faltan
  for (const tipo of Object.keys(tiposMap)) {
    if (allStock.find(i => i.tipo.toUpperCase()===tipo.toUpperCase() && i.modelos.toUpperCase().includes(modelo.toUpperCase()))) continue;
    const codigos = tiposMap[tipo];
    const grupoId = getGrupoId(tipo, DB[codigos[0].codigo]?.modelos || [modelo]);
    const safeId  = grupoId.replace(/[^a-z0-9]/gi,'-');
    try {
      const s = await apiGetStock(grupoId);
      const el = document.getElementById('fdts-' + safeId);
      if (el) { el.textContent=s; el.className='fd-tipo-stock '+(s===0?'zero':s<=2?'low':'ok'); }
    } catch(e) {}
  }
}

function toggleFdTipo(idx) {
  const hdr  = document.getElementById('fdth-' + idx);
  const body = document.getElementById('fdeb-' + idx);
  hdr.classList.toggle('open');
  body.classList.toggle('open');
}

function closeFlotaDetail() {
  document.getElementById('flotaDetail').classList.remove('open');
}

function irAScanner(codigo) {
  closeFlotaDetail();
  goPage('scanner');
  const f = buscarEnDB(codigo);
  if (f) mostrarResult(f.key, f.data);
}

// ── SHEETS API ──
function getGrupoId(tipo, modelos) {
  return (tipo+'__'+[...(Array.isArray(modelos)?modelos:[modelos])].sort().join('|')).toUpperCase();
}
async function apiGetStock(grupoId) {
  const res = await fetch(SHEET_URL+'?accion=get&grupoId='+encodeURIComponent(grupoId));
  return (await res.json()).stock||0;
}
async function apiUpdate(grupo, delta) {
  const res = await fetch(SHEET_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({accion:'update',...grupo,delta}) });
  return (await res.json()).nuevoStock;
}

// ── UTILS ──
function lev(a,b) {
  const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>[i]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i][j-1],dp[i-1][j]);
  return dp[m][n];
}
